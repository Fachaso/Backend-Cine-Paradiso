openapi: 3.0.3
info:
  title: Cine Paradiso - API REST
  version: 2.1.0
  description: >
    Contrato REST basado en el enunciado del Proyecto Integrador IDS 2026.<br>
    Arquitectura: Frontend Flask -> Python requests -> Backend REST Flask -> MySQL 8.<br>
    Autenticación gestionada mediante sesión de Flask (FlaskSessionCookie).
servers:
  - url: http://localhost:5000
    description: Servidor Local Backend Flask
tags:
  - name: Autenticación
  - name: Usuarios
  - name: Películas
  - name: Sucursales y salas
  - name: Funciones
  - name: Servicios
  - name: Compras
  - name: Acceso
  - name: Estadísticas
  - name: Reseñas opcionales
security:
  - sessionAuth: []

paths:
  /api/usuarios:
    post:
      tags:
        - Usuarios
      summary: Registrar nuevo cliente
      description: Acceso público. Crea un usuario con rol CLIENTE.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsuarioRegistro'
      responses:
        '201':
          description: Cliente registrado exitosamente
          content:
            application/json:
              schema:
                type: object
                required: [status, data]
                properties:
                  status:
                    type: string
                    enum: [success]
                    example: success
                  data:
                    $ref: '#/components/schemas/Usuario'
        '400':
          $ref: '#/components/responses/Http400'
        '409':
          $ref: '#/components/responses/Http409'

  /api/sesiones:
    post:
      tags:
        - Autenticación
      summary: Iniciar sesión de usuario
      description: >
        Valida las credenciales contra la base de datos, inicia la sesión en el backend
        y devuelve los datos básicos del usuario (incluyendo su rol CLIENTE o ADMIN)
        para que el Frontend Flask gestione las vistas y permisos.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Credenciales'
      responses:
        '200':
          description: Sesión iniciada correctamente
          content:
            application/json:
              schema:
                type: object
                required: [status, data]
                properties:
                  status:
                    type: string
                    enum: [success]
                    example: success
                  data:
                    $ref: '#/components/schemas/Usuario'
        '400':
          $ref: '#/components/responses/Http400'
        '401':
          $ref: '#/components/responses/Http401'
    delete:
      tags:
        - Autenticación
      summary: Cerrar sesión actual
      responses:
        '204':
          description: Sesión cerrada (sin contenido)
        '401':
          $ref: '#/components/responses/Http401'

  /api/perfil:
    get:
      tags:
        - Usuarios
      summary: Consultar perfil e historial de compras y películas vistas
      responses:
        '200':
          description: Perfil del usuario autenticado con su historial
          content:
            application/json:
              schema:
                type: object
                required: [status, data]
                properties:
                  status:
                    type: string
                    enum: [success]
                    example: success
                  data:
                    $ref: '#/components/schemas/Perfil'
        '401':
          $ref: '#/components/responses/Http401'

  /api/peliculas:
    get:
      tags:
        - Películas
      summary: Listar películas del catálogo local
      security: []
      parameters:
        - name: genero
          in: query
          required: false
          schema:
            type: string
          description: Filtrar por género
        - name: titulo
          in: query
          required: false
          schema:
            type: string
          description: Buscar por coincidencia en el título
      responses:
        '200':
          description: Listado de películas cargadas en la base de datos local
          content:
            application/json:
              schema:
                type: object
                required: [status, data]
                properties:
                  status:
                    type: string
                    enum: [success]
                    example: success
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Pelicula'
    post:
      tags:
        - Películas
      summary: Importar película desde la API externa al catálogo local
      description: >
        Solo ADMIN. Persiste en la tabla 'peliculas' una película previamente
        consultada en /api/peliculas-externas.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PeliculaCrear'
      responses:
        '201':
          description: Película guardada en la base de datos local
          content:
            application/json:
              schema:
                type: object
                required: [status, data]
                properties:
                  status:
                    type: string
                    enum: [success]
                    example: success
                  data:
                    $ref: '#/components/schemas/Pelicula'
        '400':
          $ref: '#/components/responses/Http400'
        '401':
          $ref: '#/components/responses/Http401'
        '403':
          $ref: '#/components/responses/Http403'
        '409':
          $ref: '#/components/responses/Http409'

  /api/peliculas/{id_pelicula}:
    get:
      tags:
        - Películas
      summary: Consultar detalle de una película
      security: []
      parameters:
        - $ref: '#/components/parameters/IdPelicula'
      responses:
        '200':
          description: Película encontrada
          content:
            application/json:
              schema:
                type: object
                required: [status, data]
                properties:
                  status:
                    type: string
                    enum: [success]
                    example: success
                  data:
                    $ref: '#/components/schemas/Pelicula'
        '404':
          $ref: '#/components/responses/Http404'

  /api/peliculas-externas:
    get:
      tags:
        - Películas
      summary: Buscar películas en proveedor externo (OMDb / TMDb)
      description: >
        Solo ADMIN. El backend consulta la API externa y devuelve candidatos.
        La película no se guarda en la BDD hasta hacer POST en /api/peliculas.
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            example: Gladiator
          description: Título o palabra clave a buscar en la API externa
      responses:
        '200':
          description: Coincidencias obtenidas de OMDb / TMDb
          content:
            application/json:
              schema:
                type: object
                required: [status, data]
                properties:
                  status:
                    type: string
                    enum: [success]
                    example: success
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PeliculaExterna'
        '400':
          $ref: '#/components/responses/Http400'
        '401':
          $ref: '#/components/responses/Http401'
        '403':
          $ref: '#/components/responses/Http403'
        '500':
          $ref: '#/components/responses/Http500'

  /api/sucursales:
    get:
      tags:
        - Sucursales y salas
      summary: Listar sucursales
      security: []
      responses:
        '200':
          description: Sucursales disponibles
          content:
            application/json:
              schema:
                type: object
                required: [status, data]
                properties:
                  status:
                    type: string
                    enum: [success]
                    example: success
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Sucursal'

  /api/sucursales/{id_sucursal}/salas:
    get:
      tags:
        - Sucursales y salas
      summary: Listar salas de una sucursal
      security: []
      parameters:
        - $ref: '#/components/parameters/IdSucursal'
      responses:
        '200':
          description: Salas de la sucursal
          content:
            application/json:
              schema:
                type: object
                required: [status, data]
                properties:
                  status:
                    type: string
                    enum: [success]
                    example: success
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Sala'
        '404':
          $ref: '#/components/responses/Http404'
    post:
      tags:
        - Sucursales y salas
      summary: Crear sala en una sucursal y generar sus asientos
      description: >
        Solo ADMIN. Crea la sala asociada a 'id_sucursal' y genera automáticamente
        sus registros en la tabla 'asientos' según la capacidad indicada.
      parameters:
        - $ref: '#/components/parameters/IdSucursal'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SalaCrear'
      responses:
        '201':
          description: Sala y asientos creados
          content:
            application/json:
              schema:
                type: object
                required: [status, data]
                properties:
                  status:
                    type: string
                    enum: [success]
                    example: success
                  data:
                    $ref: '#/components/schemas/Sala'
        '400':
          $ref: '#/components/responses/Http400'
        '401':
          $ref: '#/components/responses/Http401'
        '403':
          $ref: '#/components/responses/Http403'
        '404':
          $ref: '#/components/responses/Http404'
        '409':
          $ref: '#/components/responses/Http409'

  /api/funciones:
    get:
      tags:
        - Funciones
      summary: Listar funciones y filtrar cartelera
      security: []
      parameters:
        - name: id_pelicula
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
        - name: id_sucursal
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
        - name: fecha
          in: query
          required: false
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Funciones disponibles con datos de película, sala y sucursal
          content:
            application/json:
              schema:
                type: object
                required: [status, data]
                properties:
                  status:
                    type: string
                    enum: [success]
                    example: success
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Funcion'
        '400':
          $ref: '#/components/responses/Http400'
    post:
      tags:
        - Funciones
      summary: Programar una nueva función
      description: >
        Solo ADMIN. Recibe id_pelicula, id_sala, fecha_hora y precio_entrada
        (la sucursal se deduce automáticamente de id_sala). Valida que no exista
        solapamiento horario en esa misma sala.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FuncionCrear'
      responses:
        '201':
          description: Función creada exitosamente
          content:
            application/json:
              schema:
                type: object
                required: [status, data]
                properties:
                  status:
                    type: string
                    enum: [success]
                    example: success
                  data:
                    $ref: '#/components/schemas/Funcion'
        '400':
          $ref: '#/components/responses/Http400'
        '401':
          $ref: '#/components/responses/Http401'
        '403':
          $ref: '#/components/responses/Http403'
        '404':
          $ref: '#/components/responses/Http404'
        '409':
          $ref: '#/components/responses/Http409'

  /api/funciones/{id_funcion}:
    get:
      tags:
        - Funciones
      summary: Consultar detalle de una función
      security: []
      parameters:
        - $ref: '#/components/parameters/IdFuncion'
      responses:
        '200':
          description: Detalle de la función
          content:
            application/json:
              schema:
                type: object
                required: [status, data]
                properties:
                  status:
                    type: string
                    enum: [success]
                    example: success
                  data:
                    $ref: '#/components/schemas/Funcion'
        '404':
          $ref: '#/components/responses/Http404'

  /api/funciones/{id_funcion}/asientos:
    get:
      tags:
        - Funciones
      summary: Consultar mapa de asientos libres y ocupados de la función
      description: >
        La disponibilidad se calcula cruzando los asientos de la sala con las
        entradas activas de la función.
      security: []
      parameters:
        - $ref: '#/components/parameters/IdFuncion'
      responses:
        '200':
          description: Grilla de asientos con estado DISPONIBLE u OCUPADO
          content:
            application/json:
              schema:
                type: object
                required: [status, data]
                properties:
                  status:
                    type: string
                    enum: [success]
                    example: success
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/DisponibilidadAsiento'
        '404':
          $ref: '#/components/responses/Http404'

  /api/servicios:
    get:
      tags:
        - Servicios
      summary: Listar catálogo de servicios adicionales (comida, bebidas, combos, VIP, parking)
      security: []
      responses:
        '200':
          description: Listado de servicios adicionales
          content:
            application/json:
              schema:
                type: object
                required: [status, data]
                properties:
                  status:
                    type: string
                    enum: [success]
                    example: success
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Servicio'
    post:
      tags:
        - Servicios
      summary: Crear nuevo servicio adicional
      description: Solo ADMIN.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServicioCrear'
      responses:
        '201':
          description: Servicio creado
          content:
            application/json:
              schema:
                type: object
                required: [status, data]
                properties:
                  status:
                    type: string
                    enum: [success]
                    example: success
                  data:
                    $ref: '#/components/schemas/Servicio'
        '400':
          $ref: '#/components/responses/Http400'
        '401':
          $ref: '#/components/responses/Http401'
        '403':
          $ref: '#/components/responses/Http403'
        '409':
          $ref: '#/components/responses/Http409'

  /api/servicios/{id_servicio}:
    get:
      tags:
        - Servicios
      summary: Consultar detalle de un servicio
      security: []
      parameters:
        - $ref: '#/components/parameters/IdServicio'
      responses:
        '200':
          description: Servicio encontrado
          content:
            application/json:
              schema:
                type: object
                required: [status, data]
                properties:
                  status:
                    type: string
                    enum: [success]
                    example: success
                  data:
                    $ref: '#/components/schemas/Servicio'
        '404':
          $ref: '#/components/responses/Http404'
    patch:
      tags:
        - Servicios
      summary: Modificar campos de un servicio
      description: Solo ADMIN.
      parameters:
        - $ref: '#/components/parameters/IdServicio'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServicioActualizar'
      responses:
        '200':
          description: Servicio actualizado
          content:
            application/json:
              schema:
                type: object
                required: [status, data]
                properties:
                  status:
                    type: string
                    enum: [success]
                    example: success
                  data:
                    $ref: '#/components/schemas/Servicio'
        '400':
          $ref: '#/components/responses/Http400'
        '401':
          $ref: '#/components/responses/Http401'
        '403':
          $ref: '#/components/responses/Http403'
        '404':
          $ref: '#/components/responses/Http404'
    delete:
      tags:
        - Servicios
      summary: Eliminar servicio sin compras asociadas
      description: Solo ADMIN. Rechaza con 409 si el servicio ya figura en compras históricas.
      parameters:
        - $ref: '#/components/parameters/IdServicio'
      responses:
        '204':
          description: Servicio eliminado
        '401':
          $ref: '#/components/responses/Http401'
        '403':
          $ref: '#/components/responses/Http403'
        '404':
          $ref: '#/components/responses/Http404'
        '409':
          $ref: '#/components/responses/Http409'

  /api/compras:
    get:
      tags:
        - Compras
      summary: Consultar compras del usuario autenticado
      responses:
        '200':
          description: Historial de compras del cliente
          content:
            application/json:
              schema:
                type: object
                required: [status, data]
                properties:
                  status:
                    type: string
                    enum: [success]
                    example: success
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Compra'
        '401':
          $ref: '#/components/responses/Http401'
    post:
      tags:
        - Compras
      summary: Registrar compra de entradas y servicios adicionales
      description: >
        Verifica que los asientos estén libres, calcula el monto total en el servidor,
        crea la compra, inserta las entradas y servicios, genera el código QR único
        y envía el comprobante por correo electrónico.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompraCrear'
      responses:
        '201':
          description: Compra confirmada, entradas emitidas y QR generado
          content:
            application/json:
              schema:
                type: object
                required: [status, data]
                properties:
                  status:
                    type: string
                    enum: [success]
                    example: success
                  data:
                    $ref: '#/components/schemas/CompraDetalle'
        '400':
          $ref: '#/components/responses/Http400'
        '401':
          $ref: '#/components/responses/Http401'
        '404':
          $ref: '#/components/responses/Http404'
        '409':
          $ref: '#/components/responses/Http409'

  /api/compras/{id_compra}:
    get:
      tags:
        - Compras
      summary: Consultar detalle completo de una compra (entradas, servicios y QR)
      parameters:
        - $ref: '#/components/parameters/IdCompra'
      responses:
        '200':
          description: Detalle de la compra
          content:
            application/json:
              schema:
                type: object
                required: [status, data]
                properties:
                  status:
                    type: string
                    enum: [success]
                    example: success
                  data:
                    $ref: '#/components/schemas/CompraDetalle'
        '401':
          $ref: '#/components/responses/Http401'
        '403':
          $ref: '#/components/responses/Http403'
        '404':
          $ref: '#/components/responses/Http404'
    patch:
      tags:
        - Compras
      summary: Cancelar una compra vigente
      description: >
        Cambia estado_qr a CANCELADO (siempre que esté en estado PENDIENTE y dentro
        del plazo permitido antes de la función) y elimina las filas asociadas en
        'entradas' para liberar las butacas de la sala.
      parameters:
        - $ref: '#/components/parameters/IdCompra'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompraCancelar'
      responses:
        '200':
          description: Compra cancelada y asientos liberados
          content:
            application/json:
              schema:
                type: object
                required: [status, data]
                properties:
                  status:
                    type: string
                    enum: [success]
                    example: success
                  data:
                    $ref: '#/components/schemas/Compra'
        '400':
          $ref: '#/components/responses/Http400'
        '401':
          $ref: '#/components/responses/Http401'
        '403':
          $ref: '#/components/responses/Http403'
        '404':
          $ref: '#/components/responses/Http404'
        '409':
          $ref: '#/components/responses/Http409'

  /api/codigos-qr/{codigo_qr}:
    patch:
      tags:
        - Acceso
      summary: Validar y consumir código QR al ingresar a la sala
      description: >
        Solo ADMIN. Verifica que el QR corresponda a la función indicada y que su
        estado_qr sea PENDIENTE antes de marcarlo como USADO.
      parameters:
        - $ref: '#/components/parameters/CodigoQR'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CodigoQRUsar'
      responses:
        '200':
          description: Código QR validado y marcado como USADO
          content:
            application/json:
              schema:
                type: object
                required: [status, data]
                properties:
                  status:
                    type: string
                    enum: [success]
                    example: success
                  data:
                    $ref: '#/components/schemas/CodigoQR'
        '400':
          $ref: '#/components/responses/Http400'
        '401':
          $ref: '#/components/responses/Http401'
        '403':
          $ref: '#/components/responses/Http403'
        '404':
          $ref: '#/components/responses/Http404'
        '409':
          $ref: '#/components/responses/Http409'

  /api/estadisticas/ocupacion:
    get:
      tags:
        - Estadísticas
      summary: Consultar porcentaje de ocupación por función
      description: Solo ADMIN.
      parameters:
        - name: id_funcion
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
        - name: id_pelicula
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Ocupación por función
          content:
            application/json:
              schema:
                type: object
                required: [status, data]
                properties:
                  status:
                    type: string
                    enum: [success]
                    example: success
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Ocupacion'
        '401':
          $ref: '#/components/responses/Http401'
        '403':
          $ref: '#/components/responses/Http403'

  /api/estadisticas/ventas-por-genero:
    get:
      tags:
        - Estadísticas
      summary: Consultar ventas agrupadas por género cinematográfico
      description: Solo ADMIN.
      responses:
        '200':
          description: Ventas por género
          content:
            application/json:
              schema:
                type: object
                required: [status, data]
                properties:
                  status:
                    type: string
                    enum: [success]
                    example: success
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/VentaPorGenero'
        '401':
          $ref: '#/components/responses/Http401'
        '403':
          $ref: '#/components/responses/Http403'

  /api/estadisticas/franjas-horarias:
    get:
      tags:
        - Estadísticas
      summary: Consultar horarios de funciones más vendidos
      description: Solo ADMIN.
      responses:
        '200':
          description: Ventas por franja horaria
          content:
            application/json:
              schema:
                type: object
                required: [status, data]
                properties:
                  status:
                    type: string
                    enum: [success]
                    example: success
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/FranjaHoraria'
        '401':
          $ref: '#/components/responses/Http401'
        '403':
          $ref: '#/components/responses/Http403'

  /api/estadisticas/cancelaciones:
    get:
      tags:
        - Estadísticas
      summary: Consultar resumen de compras canceladas
      description: Solo ADMIN.
      responses:
        '200':
          description: Resumen de cancelaciones
          content:
            application/json:
              schema:
                type: object
                required: [status, data]
                properties:
                  status:
                    type: string
                    enum: [success]
                    example: success
                  data:
                    $ref: '#/components/schemas/ResumenCancelaciones'
        '401':
          $ref: '#/components/responses/Http401'
        '403':
          $ref: '#/components/responses/Http403'

  /api/peliculas/{id_pelicula}/resenas:
    get:
      tags:
        - Reseñas opcionales
      summary: Listar reseñas de una película
      security: []
      parameters:
        - $ref: '#/components/parameters/IdPelicula'
      responses:
        '200':
          description: Reseñas de la película
          content:
            application/json:
              schema:
                type: object
                required: [status, data]
                properties:
                  status:
                    type: string
                    enum: [success]
                    example: success
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Resena'
        '404':
          $ref: '#/components/responses/Http404'
    post:
      tags:
        - Reseñas opcionales
      summary: Crear reseña de una película vista
      description: >
        Solo pueden reseñar los usuarios que tengan una compra para esa película
        con estado_qr = USADO.
      parameters:
        - $ref: '#/components/parameters/IdPelicula'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResenaCrear'
      responses:
        '201':
          description: Reseña creada
          content:
            application/json:
              schema:
                type: object
                required: [status, data]
                properties:
                  status:
                    type: string
                    enum: [success]
                    example: success
                  data:
                    $ref: '#/components/schemas/Resena'
        '400':
          $ref: '#/components/responses/Http400'
        '401':
          $ref: '#/components/responses/Http401'
        '403':
          $ref: '#/components/responses/Http403'
        '404':
          $ref: '#/components/responses/Http404'
        '409':
          $ref: '#/components/responses/Http409'

components:
  securitySchemes:
    sessionAuth:
      type: apiKey
      in: cookie
      name: session
      description: Sesión autenticada del backend Flask.

  parameters:
    IdPelicula:
      name: id_pelicula
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    IdSucursal:
      name: id_sucursal
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    IdFuncion:
      name: id_funcion
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    IdServicio:
      name: id_servicio
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    IdCompra:
      name: id_compra
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    CodigoQR:
      name: codigo_qr
      in: path
      required: true
      schema:
        type: string

  responses:
    Http400:
      description: Solicitud inválida o datos faltantes
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Http401:
      description: No autenticado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Http403:
      description: Acceso denegado para el rol actual
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Http404:
      description: Recurso no encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Http409:
      description: Conflicto con el estado actual o reglas de negocio
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Http500:
      description: Error interno o falla en servicio externo
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    Error:
      type: object
      required: [status, code, message]
      properties:
        status:
          type: string
          enum: [error]
          example: error
        code:
          type: string
          example: RECURSO_NO_ENCONTRADO
        message:
          type: string
          example: No se encontró el recurso solicitado

    UsuarioRegistro:
      type: object
      required: [nombre, email, password]
      properties:
        nombre:
          type: string
          maxLength: 100
          example: Ana García
        email:
          type: string
          format: email
          maxLength: 100
          example: ana@example.com
        password:
          type: string
          format: password
          minLength: 6
          example: clave_segura123

    Credenciales:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: ana@example.com
        password:
          type: string
          format: password
          example: clave_segura123

    Usuario:
      type: object
      required: [id_usuario, nombre, email, rol]
      properties:
        id_usuario:
          type: integer
          minimum: 1
          example: 2
        nombre:
          type: string
          example: Ana García
        email:
          type: string
          format: email
          example: ana@example.com
        rol:
          type: string
          enum: [CLIENTE, ADMIN]
          example: CLIENTE

    Perfil:
      type: object
      required: [usuario, compras]
      properties:
        usuario:
          $ref: '#/components/schemas/Usuario'
        compras:
          type: array
          items:
            $ref: '#/components/schemas/Compra'

    Pelicula:
      type: object
      required: [id_pelicula, titulo, genero, duracion_min, clasificacion]
      properties:
        id_pelicula:
          type: integer
          minimum: 1
          example: 1
        titulo:
          type: string
          example: Gladiator II
        sinopsis:
          type: string
          example: Lucio ingresa al Coliseo para luchar por el destino de Roma.
        poster_url:
          type: string
          format: uri
          example: https://image.tmdb.org/t/p/w500/demo1.jpg
        genero:
          type: string
          example: Acción
        duracion_min:
          type: integer
          minimum: 1
          example: 148
        clasificacion:
          type: string
          example: '+16'

    PeliculaCrear:
      type: object
      required: [titulo, genero, duracion_min, clasificacion]
      properties:
        titulo:
          type: string
          example: Gladiator II
        sinopsis:
          type: string
          example: Lucio ingresa al Coliseo para luchar por el destino de Roma.
        poster_url:
          type: string
          format: uri
          example: https://image.tmdb.org/t/p/w500/demo1.jpg
        genero:
          type: string
          example: Acción
        duracion_min:
          type: integer
          minimum: 1
          example: 148
        clasificacion:
          type: string
          example: '+16'

    PeliculaExterna:
      type: object
      required: [id_externo, titulo]
      properties:
        id_externo:
          type: string
          example: tt9218128
        titulo:
          type: string
          example: Gladiator II
        sinopsis:
          type: string
          example: Lucio ingresa al Coliseo para luchar por el destino de Roma.
        poster_url:
          type: string
          format: uri
          example: https://image.tmdb.org/t/p/w500/demo1.jpg
        duracion_min:
          type: integer
          minimum: 1
          example: 148
        clasificacion:
          type: string
          example: '+16'
        genero:
          type: string
          example: Acción

    Sucursal:
      type: object
      required: [id_sucursal, nombre, direccion, ciudad]
      properties:
        id_sucursal:
          type: integer
          minimum: 1
          example: 1
        nombre:
          type: string
          example: Cine Paradiso Central
        direccion:
          type: string
          example: Av. Corrientes 1234
        ciudad:
          type: string
          example: CABA

    Sala:
      type: object
      required: [id_sala, id_sucursal, nombre, capacidad]
      properties:
        id_sala:
          type: integer
          minimum: 1
          example: 1
        id_sucursal:
          type: integer
          minimum: 1
          example: 1
        nombre:
          type: string
          example: Sala 1
        capacidad:
          type: integer
          minimum: 1
          example: 30

    SalaCrear:
      type: object
      required: [nombre, capacidad]
      properties:
        nombre:
          type: string
          maxLength: 50
          example: Sala 3
        capacidad:
          type: integer
          minimum: 1
          example: 30

    DisponibilidadAsiento:
      type: object
      required: [id_asiento, fila, numero, estado]
      properties:
        id_asiento:
          type: integer
          minimum: 1
          example: 1
        fila:
          type: string
          example: A
        numero:
          type: integer
          minimum: 1
          example: 1
        estado:
          type: string
          enum: [DISPONIBLE, OCUPADO]
          example: DISPONIBLE

    Funcion:
      type: object
      required: [id_funcion, id_pelicula, id_sala, fecha_hora, precio_entrada]
      properties:
        id_funcion:
          type: integer
          minimum: 1
          example: 1
        id_pelicula:
          type: integer
          minimum: 1
          example: 1
        titulo_pelicula:
          type: string
          example: Gladiator II
        id_sala:
          type: integer
          minimum: 1
          example: 1
        nombre_sala:
          type: string
          example: Sala 1
        id_sucursal:
          type: integer
          minimum: 1
          example: 1
        nombre_sucursal:
          type: string
          example: Cine Paradiso Central
        fecha_hora:
          type: string
          format: date-time
          example: '2026-11-05T20:00:00-03:00'
        precio_entrada:
          type: number
          format: double
          minimum: 0
          example: 4500.0

    FuncionCrear:
      type: object
      required: [id_pelicula, id_sala, fecha_hora, precio_entrada]
      properties:
        id_pelicula:
          type: integer
          minimum: 1
          example: 1
        id_sala:
          type: integer
          minimum: 1
          example: 1
        fecha_hora:
          type: string
          format: date-time
          example: '2026-11-05T20:00:00-03:00'
        precio_entrada:
          type: number
          format: double
          minimum: 0
          example: 4500.0

    Servicio:
      type: object
      required: [id_servicio, nombre, tipo, precio]
      properties:
        id_servicio:
          type: integer
          minimum: 1
          example: 1
        nombre:
          type: string
          example: Combo Popcorn + Gaseosa
        descripcion:
          type: string
          example: Balde grande de pochoclos y gaseosa 500ml
        tipo:
          type: string
          enum: [COMIDA, BEBIDA, COMBO, ESTACIONAMIENTO, VIP, OTRO]
          example: COMBO
        precio:
          type: number
          format: double
          minimum: 0
          example: 3500.0

    ServicioCrear:
      type: object
      required: [nombre, tipo, precio]
      properties:
        nombre:
          type: string
          example: Combo Popcorn + Gaseosa
        descripcion:
          type: string
          example: Balde grande de pochoclos y gaseosa 500ml
        tipo:
          type: string
          enum: [COMIDA, BEBIDA, COMBO, ESTACIONAMIENTO, VIP, OTRO]
          example: COMBO
        precio:
          type: number
          format: double
          minimum: 0
          example: 3500.0

    ServicioActualizar:
      type: object
      properties:
        nombre:
          type: string
          example: Combo Popcorn + Gaseosa
        descripcion:
          type: string
          example: Balde grande de pochoclos y gaseosa 500ml
        tipo:
          type: string
          enum: [COMIDA, BEBIDA, COMBO, ESTACIONAMIENTO, VIP, OTRO]
          example: COMBO
        precio:
          type: number
          format: double
          minimum: 0
          example: 3800.0

    ServicioEnCompra:
      type: object
      required: [id_servicio, cantidad]
      properties:
        id_servicio:
          type: integer
          minimum: 1
          example: 1
        cantidad:
          type: integer
          minimum: 1
          example: 1

    CompraCrear:
      type: object
      description: Registra una compra para una función, asignando asientos y servicios opcionales.
      required: [id_funcion, asientos_ids]
      properties:
        id_funcion:
          type: integer
          minimum: 1
          example: 1
        asientos_ids:
          type: array
          items:
            type: integer
            minimum: 1
          minItems: 1
          uniqueItems: true
          example: [1, 2]
        servicios:
          type: array
          items:
            $ref: '#/components/schemas/ServicioEnCompra'

    Compra:
      type: object
      required: [id_compra, id_usuario, fecha_compra, monto_total, codigo_qr, estado_qr]
      properties:
        id_compra:
          type: integer
          minimum: 1
          example: 1
        id_usuario:
          type: integer
          minimum: 1
          example: 2
        fecha_compra:
          type: string
          format: date-time
          example: '2026-11-01T18:30:00-03:00'
        monto_total:
          type: number
          format: double
          minimum: 0
          example: 12500.0
        codigo_qr:
          type: string
          example: QR-8F92A1B3
        estado_qr:
          type: string
          enum: [PENDIENTE, USADO, CANCELADO]
          example: PENDIENTE

    Entrada:
      type: object
      required: [id_entrada, id_compra, id_funcion, id_asiento, precio]
      properties:
        id_entrada:
          type: integer
          minimum: 1
          example: 1
        id_compra:
          type: integer
          minimum: 1
          example: 1
        id_funcion:
          type: integer
          minimum: 1
          example: 1
        id_asiento:
          type: integer
          minimum: 1
          example: 1
        fila:
          type: string
          example: A
        numero:
          type: integer
          example: 1
        precio:
          type: number
          format: double
          minimum: 0
          example: 4500.0

    DetalleCompraServicio:
      type: object
      required: [id_detalle, id_compra, id_servicio, cantidad, precio_unitario]
      properties:
        id_detalle:
          type: integer
          minimum: 1
          example: 1
        id_compra:
          type: integer
          minimum: 1
          example: 1
        id_servicio:
          type: integer
          minimum: 1
          example: 1
        nombre_servicio:
          type: string
          example: Combo Popcorn + Gaseosa
        cantidad:
          type: integer
          minimum: 1
          example: 1
        precio_unitario:
          type: number
          format: double
          minimum: 0
          example: 3500.0

    CompraDetalle:
      type: object
      required: [compra, entradas, servicios]
      properties:
        compra:
          $ref: '#/components/schemas/Compra'
        entradas:
          type: array
          items:
            $ref: '#/components/schemas/Entrada'
        servicios:
          type: array
          items:
            $ref: '#/components/schemas/DetalleCompraServicio'

    CompraCancelar:
      type: object
      required: [estado_qr]
      properties:
        estado_qr:
          type: string
          enum: [CANCELADO]
          example: CANCELADO

    CodigoQR:
      type: object
      required: [codigo_qr, estado_qr]
      properties:
        codigo_qr:
          type: string
          example: QR-8F92A1B3
        estado_qr:
          type: string
          enum: [PENDIENTE, USADO, CANCELADO]
          example: USADO

    CodigoQRUsar:
      type: object
      required: [id_funcion]
      properties:
        id_funcion:
          type: integer
          minimum: 1
          example: 1

    Resena:
      type: object
      required: [id_resena, id_usuario, id_pelicula, puntuacion, fecha]
      properties:
        id_resena:
          type: integer
          minimum: 1
          example: 1
        id_usuario:
          type: integer
          minimum: 1
          example: 2
        nombre_usuario:
          type: string
          example: Ana García
        id_pelicula:
          type: integer
          minimum: 1
          example: 1
        puntuacion:
          type: integer
          minimum: 1
          maximum: 5
          example: 5
        comentario:
          type: string
          example: Excelente película y muy buena sala.
        fecha:
          type: string
          format: date-time
          example: '2026-11-06T10:15:00-03:00'

    ResenaCrear:
      type: object
      required: [puntuacion]
      properties:
        puntuacion:
          type: integer
          minimum: 1
          maximum: 5
          example: 5
        comentario:
          type: string
          example: Excelente película y muy buena sala.

    Ocupacion:
      type: object
      required: [id_funcion, capacidad, entradas_vendidas, porcentaje_ocupacion]
      properties:
        id_funcion:
          type: integer
          minimum: 1
          example: 1
        titulo_pelicula:
          type: string
          example: Gladiator II
        nombre_sala:
          type: string
          example: Sala 1
        fecha_hora:
          type: string
          format: date-time
          example: '2026-11-05T20:00:00-03:00'
        capacidad:
          type: integer
          minimum: 1
          example: 30
        entradas_vendidas:
          type: integer
          minimum: 0
          example: 15
        porcentaje_ocupacion:
          type: number
          format: double
          minimum: 0
          example: 50.0

    VentaPorGenero:
      type: object
      required: [genero, total_ventas, entradas_vendidas]
      properties:
        genero:
          type: string
          example: Acción
        total_ventas:
          type: number
          format: double
          minimum: 0
          example: 67500.0
        entradas_vendidas:
          type: integer
          minimum: 0
          example: 15

    FranjaHoraria:
      type: object
      required: [hora, entradas_vendidas]
      properties:
        hora:
          type: string
          example: '20:00'
        entradas_vendidas:
          type: integer
          minimum: 0
          example: 15

    ResumenCancelaciones:
      type: object
      required: [total_cancelaciones]
      properties:
        total_cancelaciones:
          type: integer
          minimum: 0
          example: 2